name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the running checks pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Type-checks with vue-tsc, then bundles.
      - name: Build frontend
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --locked

  # The ignored tests, against the same servers as on a developer machine:
  # an SFTP server, and SCP on Debian and Alpine, whose `ls` differ.
  live:
    name: Live tests (SFTP and SCP servers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Start the test servers
        run: |
          docker run -d --name omniscp-sftp-test -p 2222:22 atmoz/sftp test:test:::upload
          for os in debian alpine; do
            docker build -q -t omniscp-scp-$os -f src-tauri/tests/scp-server/Dockerfile.$os src-tauri/tests/scp-server
          done
          docker run -d --name omniscp-scp-debian -p 2223:22 omniscp-scp-debian
          docker run -d --name omniscp-scp-alpine -p 2224:22 omniscp-scp-alpine
          for port in 2222 2223 2224; do
            for i in $(seq 30); do ssh-keyscan -p $port localhost >/dev/null 2>&1 && break; sleep 1; done
          done

      - name: Build the tests
        working-directory: src-tauri
        run: cargo test --locked --no-run

      # Each file runs where it applies; transfer_live runs on all four setups.
      - name: Run the live tests
        working-directory: src-tauri
        run: |
          fp() { ssh-keyscan -t "$2" -p "$1" localhost 2>/dev/null | ssh-keygen -lf - | awk '{print $2}'; }
          live() { cargo test --locked --test "$1" -- --ignored --test-threads=1; }

          echo "::group::SFTP"
          export OMNISCP_TEST_CHROOT=/home/test OMNISCP_TEST_OWNER= OMNISCP_TEST_FINGERPRINT=$(fp 2222 ed25519)
          live sftp_live
          live transfer_live
          unset OMNISCP_TEST_CHROOT OMNISCP_TEST_OWNER
          echo "::endgroup::"

          for setup in "scp 2223 debian" "scp 2224 alpine" "sftp 2223 debian"; do
            set -- $setup
            echo "::group::$1 on $3"
            export OMNISCP_TEST_PROTOCOL=$1 OMNISCP_TEST_PORT=$2 OMNISCP_TEST_BASE=/home/test \
              OMNISCP_TEST_CONTAINER=omniscp-scp-$3 OMNISCP_TEST_FINGERPRINT=$(fp $2 ecdsa)
            if [ "$1" = scp ]; then live scp_live; fi
            live transfer_live
            echo "::endgroup::"
          done
