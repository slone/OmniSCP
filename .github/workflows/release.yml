name: Release

# A tag `vX.Y.Z` builds the installers and attaches them to a draft release.
# Running it by hand builds them as workflow artifacts only.
#
# Signing turns on by itself once its secrets exist (see RELEASING.md);
# without them the installers are built unsigned.
on:
  push:
    tags: ['v*']
    branches: [feature/release]  # TEMPORARY: test run before the merge
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Installers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          # The oldest supported runner, so the AppImage and packages work on
          # distributions with an older glibc.
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"
            exit 1
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Tauri signs as soon as these variables exist, even empty, so they are
      # only set when the secrets are there.
      - name: Set up macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          add() { printf '%s<<EOF_ENV\n%s\nEOF_ENV\n' "$1" "$2" >> "$GITHUB_ENV"; }
          if [ -n "$APPLE_CERTIFICATE" ]; then
            add APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
            add APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
            add APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
            if [ -n "$APPLE_ID" ]; then
              add APPLE_ID "$APPLE_ID"
              add APPLE_PASSWORD "$APPLE_PASSWORD"
              add APPLE_TEAM_ID "$APPLE_TEAM_ID"
            else
              echo "::warning::No APPLE_ID secret: the app is signed but not notarized."
            fi
          else
            # Ad hoc: no identity, but Apple Silicon refuses to run unsigned code.
            add APPLE_SIGNING_IDENTITY "-"
            echo "::warning::No APPLE_CERTIFICATE secret: the macOS app is not signed."
          fi

      - name: Set up Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            Remove-Item $pfx
            $config = Join-Path $env:RUNNER_TEMP 'tauri.signing.json'
            @{ bundle = @{ windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = 'sha256'
              timestampUrl = 'http://timestamp.digicert.com'
            } } } | ConvertTo-Json -Depth 5 | Set-Content $config
            "SIGNING_ARGS=--config $config" >> $env:GITHUB_ENV
          } else {
            "::warning::No WINDOWS_CERTIFICATE secret: the Windows installers are not signed."
          }

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Empty when run by hand: build only, no release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: OmniSCP ${{ github.ref_name }}
          releaseBody: See the README for what OmniSCP does. Pick the installer for your system below.
          releaseDraft: true
          args: ${{ matrix.args }} ${{ env.SIGNING_ARGS }}

      - uses: actions/upload-artifact@v4
        with:
          name: omniscp-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
